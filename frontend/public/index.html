<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus — productivité</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Focus !</h1>
    <!-- Navigation entre les trois sections -->
    <nav id="tabs">
      <button data-tab="todos" class="active">Tâches</button>
      <button data-tab="pomodoro">Pomodoro</button>
      <button data-tab="agenda">Agenda</button>
    </nav>
  </header>

  <p id="error" hidden></p>

  <main>
    <!-- ===== Section Tâches ===== -->
    <section id="tab-todos">
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Nouvelle tâche…" autocomplete="off" required>
        <button type="submit">Ajouter</button>
      </form>
      <nav id="todo-filters" class="filters">
        <button data-filter="all" class="active">Toutes</button>
        <button data-filter="todo">À faire</button>
        <button data-filter="done">Terminées</button>
      </nav>
      <ul id="todo-list"></ul>
      <p id="todo-counter" class="muted"></p>
    </section>

    <!-- ===== Section Pomodoro ===== -->
    <section id="tab-pomodoro" hidden>
      <nav id="pomo-modes" class="filters">
        <button data-mode="focus" class="active">Concentration 25 min</button>
        <button data-mode="short">Pause 5 min</button>
        <button data-mode="long">Longue pause 15 min</button>
      </nav>
      <div id="pomo-time" aria-live="off">25:00</div>
      <div class="row">
        <button id="pomo-toggle">Démarrer</button>
        <button id="pomo-reset" class="secondary">Réinitialiser</button>
      </div>
      <p id="pomo-stats" class="muted"></p>
    </section>

    <!-- ===== Section Agenda ===== -->
    <section id="tab-agenda" hidden>
      <div class="agenda">
        <div>
          <div class="cal-head">
            <button id="cal-prev" class="secondary" aria-label="Mois précédent">‹</button>
            <h2 id="cal-title"></h2>
            <button id="cal-next" class="secondary" aria-label="Mois suivant">›</button>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>
        <aside>
          <h3 id="day-title"></h3>
          <ul id="day-events"></ul>
          <form id="event-form">
            <input id="event-title" type="text" placeholder="Nouvel événement…" autocomplete="off" required>
            <input id="event-time" type="time" aria-label="Heure">
            <button type="submit">Ajouter</button>
          </form>
        </aside>
      </div>
    </section>
  </main>

  <!-- config.js d'abord (classique), puis le code en modules ES -->
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
